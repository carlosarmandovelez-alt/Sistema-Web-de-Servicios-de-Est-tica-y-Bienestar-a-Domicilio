# Perfil de pruebas: base de datos en memoria para no depender de MySQL
spring.datasource.url=jdbc:h2:mem:hu008;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Evita que el contexto intente conectarse a un servidor SMTP real
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

