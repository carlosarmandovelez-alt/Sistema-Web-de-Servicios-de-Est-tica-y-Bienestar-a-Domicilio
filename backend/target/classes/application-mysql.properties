spring.datasource.url=${MYSQL_DB_URL:jdbc:mysql://localhost:3306/proyecto_servicios_domicilio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_DB_USER:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Solo para desarrollo local: muestra la causa real del error en la respuesta
server.error.include-message=always
